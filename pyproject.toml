[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zuspec-rt-eng"
version = "0.0.1"
description = "Zuspec runtime engine: native ZBC (.zbc) loader + bytecode interpreter over the rt-core substrate"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Matthew Ballance", email = "matt.ballance@gmail.com"}
]
dependencies = [
    "zuspec-rt-core",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "zuspec-be-bc",
]

[tool.setuptools]
packages = ["zuspec.rt.eng"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"zuspec.rt.eng" = ["share/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
